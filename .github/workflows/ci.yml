name: MLflow CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Docker
      run: |
        sudo apt-get update
        sudo apt-get install -y docker.io
        sudo usermod -aG docker $USER

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 pandas numpy scikit-learn

    - name: Run MLflow Project
      run: |
        cd MLProject
        mlflow run . --env-manager=local

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        cd MLProject
        if [ -f run_id.txt ]; then
          RUN_ID=$(cat run_id.txt)
          echo "Using RUN_ID: $RUN_ID"
          mlflow models build-docker \
            -m "runs:/${RUN_ID}/model" \
            -n "${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest" \
            --python-version 3.10
        else
          echo "ERROR: run_id.txt not found!"
          exit 1
        fi

    - name: Push Docker Image
      run: |
        docker push "${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest"

    - name: Verify Docker Image
      run: |
        docker images | grep telco-churn-model