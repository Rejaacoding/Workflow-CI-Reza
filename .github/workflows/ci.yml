name: MLflow CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 pandas numpy scikit-learn

    - name: Run MLflow Project
      run: |
        cd MLProject
        mlflow run . --env-manager=local

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        cd MLProject
        if [ -f run_id.txt ]; then
          RUN_ID=$(cat run_id.txt)
          
          # 1. Generate Dockerfile (Tanpa build otomatis)
          mlflow models generate-dockerfile -m "runs:/${RUN_ID}/model" -d docker_build_dir
          
          # 2. Patch: Perbaiki URL get-pip.py agar mendukung Python 3.9
          sed -i 's|https://bootstrap.pypa.io/get-pip.py|https://bootstrap.pypa.io/pip/3.9/get-pip.py|g' docker_build_dir/Dockerfile
          
          # 3. Build Manual (Docker sudah terinstal di runner, jadi langsung bisa dipakai)
          docker build -t "${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest" docker_build_dir/
          
          # 4. Push
          docker push "${{ secrets.DOCKER_USERNAME }}/telco-churn-model:latest"
        else
          echo "ERROR: run_id.txt not found!"
          exit 1
        fi

    - name: Verify Docker Image
      run: |
        docker images | grep telco-churn-model